name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  privacy-and-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_privacy.py
      - run: swift test
      - run: python3 generate-project.py
      - run: xcodebuild -project FamilyTV.xcodeproj -scheme FamilyTV -sdk appletvsimulator -destination "generic/platform=tvOS Simulator" -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python3 AndroidTV/build.py
